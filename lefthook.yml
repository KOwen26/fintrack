pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,svelte}'
      run: pnpx eslint --fix --quiet {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,svelte,html,css}'
      run: pnpx prettier --write {staged_files}
      stage_fixed: true
    laravel_rector:
      run: composer rector {staged_files} || powershell -Command 'composer rector {staged_files}'
      fail_text: 'Rector Linting Failed'
      stage_fixed: true
    laravel:
      run: composer format || powershell -Command 'composer format'
      fail_text: 'Laravel Formatting Failed'
      stage_fixed: true
