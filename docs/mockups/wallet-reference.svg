<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 277 277" width="277" height="277">
    <title>Fintrack wallet mark — money kept and growing</title>
    <defs>
        <linearGradient id="walletG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2C5480" />
            <stop offset="1" stop-color="#142C46" />
        </linearGradient>
        <linearGradient id="arrowG" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#17987D" />
            <stop offset="1" stop-color="#25BA98" />
        </linearGradient>
        <radialGradient id="coinG" cx="0.35" cy="0.3" r="1">
            <stop offset="0" stop-color="#FBD97A" />
            <stop offset="1" stop-color="#F2BC45" />
        </radialGradient>
        <clipPath id="walletClip">
            <rect x="46" y="130" width="190" height="114" rx="28" />
        </clipPath>
    </defs>

    <!-- soft ground shadow -->
    <ellipse cx="140" cy="249" rx="52" ry="5" fill="#0F1E30" opacity="0.13" />

    <!-- growth arrow: short shaft + big head, tucked behind the wallet -->
    <path d="M207 83 L178 112" stroke="url(#arrowG)" stroke-width="24" stroke-linecap="round" fill="none" />
    <polygon points="233,57 190,65 225,100" fill="url(#arrowG)" stroke="url(#arrowG)" stroke-width="10" stroke-linejoin="round" />

    <!-- wallet back panel (peeks above the front, right side) -->
    <rect x="186" y="94" width="48" height="48" rx="12" fill="#16304E" />

    <!-- banknote (tilted, tucked behind the wallet front) -->
    <g transform="rotate(-13 111 95)">
        <rect x="48" y="58" width="126" height="74" rx="10" fill="#12A184" />
        <rect x="158" y="58" width="16" height="74" rx="8" fill="#0B7E66" />
    </g>

    <!-- wallet front with pocket band and seam -->
    <rect x="46" y="130" width="190" height="114" rx="28" fill="url(#walletG)" />
    <g clip-path="url(#walletClip)">
        <rect x="46" y="130" width="190" height="32" fill="#306090" />
        <path d="M46 162 H236" stroke="#10263E" stroke-width="3" opacity="0.45" />
    </g>

    <!-- gold coin with dollar sign (sits in the front pocket) -->
    <circle cx="143" cy="112" r="42" fill="#E2A838" />
    <circle cx="143" cy="108" r="41" fill="url(#coinG)" />
    <text x="143" y="129" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="48" font-weight="800" fill="#1D3B61">$</text>

    <!-- clasp: teal plate + blue tab + white button -->
    <rect x="171" y="160" width="62" height="57" rx="16" fill="#16A58C" />
    <rect x="183" y="168" width="40" height="37" rx="10" fill="#306090" />
    <circle cx="203" cy="186.5" r="7" fill="#FFFFFF" />
</svg>
